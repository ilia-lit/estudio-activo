<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio Activo</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f2d5a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estudio Activo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e6e3dc;--blue:#2f5bd3;--green:#1f8a5b;--navy:#1f2d5a}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1e1e21;--ink:#f2f2f3;--muted:#a0a0a8;--line:#2e2e33;--blue:#7c9cf5;--green:#5fcf9b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}
.top{background:var(--navy);color:#fff;padding:28px 18px 34px}
.top .in{max-width:640px;margin:0 auto;display:flex;gap:14px;align-items:center}
.top img{width:56px;height:56px;border-radius:14px}
.top h1{margin:0;font-size:1.45rem;letter-spacing:-.01em}
.top p{margin:2px 0 0;opacity:.8;font-size:.9rem}
main{max-width:640px;margin:-18px auto 0;padding:0 14px 60px}
.m{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.m .tag{font-size:.72rem;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}
.m h2{margin:4px 0 4px;font-size:1.08rem}
.m p{margin:0;color:var(--muted);font-size:.88rem}
.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--green)}
.prog{font-size:.78rem;color:var(--muted);margin-top:5px}
.add{border:2px dashed var(--line);border-radius:16px;padding:16px;text-align:center;color:var(--muted);font-size:.9rem;margin:12px 0}
.btn{display:none;width:100%;border:none;border-radius:12px;padding:13px;font:700 .95rem Inter,sans-serif;background:var(--blue);color:#fff;cursor:pointer;margin-top:6px}
.hint{display:none;font-size:.85rem;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
</style>
</head>
<body>
<div class="top"><div class="in">
  <img src="icon-192.png" alt="">
  <div><h1>Estudio Activo</h1><p>Memoria activa · repetición espaciada · práctica</p></div>
</div></div>
<main>
  <button class="btn" id="install">📲 Instalar app</button>
  <div class="hint" id="iosHint">En iPhone: toca <b>Compartir</b> y luego <b>“Agregar a inicio”</b>.</div>
  <div id="list"></div>
  <div class="add">➕ ¿Nueva materia? Pásale el material a Claude y te devuelve el archivo para agregarla aquí.</div>
</main>
<script>
// Para agregar una materia: añade un objeto aquí y sube su archivo .html
const MATERIAS=[
  {file:"unidad2.html", tag:"CPE2811 · Unidad 2", title:"Recursos Financieros (LM8–LM13) + Cartera Crediticia",
   desc:"MISBR · CNBS · Capital, rentabilidad, liquidez, solvencia, desempeño continuo, financiamiento y Circular 001/2025.",
   key:"u2_boxes", total:66},
  {file:"ingles.html", tag:"Inglés · Reading Horizons", title:"Pronunciación y lectura en inglés",
   desc:"Phonetic Skills, sonidos, dígrafos, sílabas y cultura. Sigue tu Student Workbook y el English Language Enhancement. Con audio 🔊.",
   key:"en_boxes", total:102},
  {file:"ingles-b1.html", tag:"Inglés · Ruta a C1 · Etapa 1", title:"Inglés A2 → B1: gramática y vocabulario",
   desc:"Tu ruta de 2 años hacia C1, 14 unidades de gramática, práctica, ejercicios para hacer con Claude y examen semanal. Con audio 🔊.",
   key:"b1_boxes", total:85}
  ,{file:"vocabulario.html", tag:"Inglés · Vocabulario C1", title:"Vocabulario hacia C1 · 16 bloques",
   desc:"Bloque 1 disponible (461 palabras). Repaso por días como Anki, frase de ejemplo y audio en cada palabra.",
   key:"voc_state", total:461}
];
function get(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}
document.getElementById('list').innerHTML=MATERIAS.map(m=>{
  const b=get(m.key); const done=Object.values(b).filter(v=>typeof v==='number'?v===3:(v&&v.b>=3)).length; const pct=Math.round(100*done/m.total);
  return `<a class="m" href="${m.file}"><div class="tag">${m.tag}</div><h2>${m.title}</h2><p>${m.desc}</p>
  <div class="bar"><i style="width:${pct}%"></i></div><div class="prog">${done} de ${m.total} tarjetas dominadas (${pct}%)</div></a>`}).join('');
// instalación
let deferred=null; const ib=document.getElementById('install');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;ib.style.display='block'});
ib.onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;ib.style.display='none'};
const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone) document.getElementById('iosHint').style.display='block';
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
